<html>
    <head>
        <!-- Viewport -->
        <meta name="viewport" content="width=device-width" />

        <!-- CSS -->
        <link rel="stylesheet" href="index.css">
        
        <!-- Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        
        <!-- Font -->
        <script src="https://kit.fontawesome.com/6770df082b.js" crossorigin="anonymous"></script>
    </head>
    <body>

        <header>
            <div class="header-inner-container">
                <div class="theme-container">
                    <label for="theme">Select Theme</label>
                    <select id="theme">
                        <option id="theme-system">System</option>
                        <option id="theme-light">Light</option>
                        <option id="theme-dark">Dark</option>
                    </select>
                </div>

                <div class="header-content">
                    <h1 class="header-title">Find Your Film</h1>
                    <a>My Watchlist</a>
                </div>
            </div>
        </header>
        
        <main>
            <form class="search-form">
                <div class="search-form-inner">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <label for='movie-search-input' class="sr-only">Searchbar</label>
                    <input type="search" id='movie-search-input' name='movie-search-input' placeholder="Search for a movie">
                    <button class="search-btn" id="search-btn">Search</button>
                </div>
            </form>
            
            <section class="movies-section">
                <div class="explore-hint-container" hidden>
                    <p>Start Exploring</p>
                </div>

                <div class="movies-list">

                </div>
            </section>
            
        </main>
        <footer>
            Footer
        </footer>
        <script src="index.js"></script>

    </body>
</html>
